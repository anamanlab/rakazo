services:
  api:
    image: ${RAKAZO_IMAGE:-rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    restart: unless-stopped
    # Node runs directly, not through pnpm: pnpm does not pass SIGTERM on, so a stop would kill the
    # process before its graceful shutdown finishes in-flight requests and jobs.
    working_dir: /app/apps/api
    command:
      - bash
      - -lc
      - pnpm db:deploy && exec env -u DATABASE_MIGRATION_URL node --enable-source-maps dist/index.js
    init: true
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    environment:
      <<: *app-environment
      # Owner login for migrations; the start command drops it before serving.
      DATABASE_MIGRATION_URL:
      # Sign-in, sessions, billing and inbound webhooks: API only.
      API_HOST: "0.0.0.0"
      API_PORT:
      BETTER_AUTH_SECRET:
      BETTER_AUTH_URL:
      WEB_ORIGIN:
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
      AUTH_BREACHED_PASSWORD_CHECK_ENABLED: ${AUTH_BREACHED_PASSWORD_CHECK_ENABLED:-false}
      PASSKEY_APPLE_APP_IDS:
      PASSKEY_ANDROID_CERT_SHA256:
      # The edge in front of the API whose forwarded client address is believed.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOW_SIGNUP_BYPASS: ${OIDC_ALLOW_SIGNUP_BYPASS:-false}
      SIGNUPS_ENABLED:
      SIGNUP_ALLOWLIST:
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      RAKAZO_DESKTOP_STACK_TOKEN:
      RAKAZO_GIT_SHA:
      SENTRY_BROWSER_DSN: ${SENTRY_BROWSER_DSN:-}
      PRIVACY_POLICY_URL:
      SPACE_TEARDOWN_TIMEOUT_MS:
    expose:
      - "3100"
    volumes:
      - appdata:/data
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      # Probe every second while starting, so a deploy hands traffic over as soon as it can.
      start_period: 2m
      start_interval: 1s

  worker:
    image: ${RAKAZO_IMAGE:-rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    restart: unless-stopped
    # Directly, not through pnpm, so a stop reaches it (see the api command).
    working_dir: /app/apps/worker
    command: ["node", "--enable-source-maps", "dist/index.js"]
    init: true
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    environment:
      <<: *app-environment
      GRAPHILE_WORKER_CONCURRENCY:
    volumes:
      - appdata:/data
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const fs = require('fs');
          try {
            const data = JSON.parse(fs.readFileSync('/tmp/worker-heartbeat.json', 'utf8'));
            if (Date.now() - data.timestamp > 30000) process.exit(1);
          } catch {
            process.exit(1);
          }
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ${RAKAZO_IMAGE:-rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    restart: unless-stopped
    # Directly, not through pnpm, so a stop reaches it (see the api command).
    working_dir: /app/apps/web
    command: ["node_modules/.bin/vite", "preview", "--host", "0.0.0.0", "--port", "5173"]
    init: true
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3100
      RAKAZO_HOST: ${RAKAZO_HOST:-app.example.com}
      RAKAZO_ALLOWED_HOSTS: ${RAKAZO_ALLOWED_HOSTS:-app.example.com}
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
      RAKAZO_CSP_SCRIPT_SRC: ${RAKAZO_CSP_SCRIPT_SRC:-}
      RAKAZO_CSP_CONNECT_SRC: ${RAKAZO_CSP_CONNECT_SRC:-}
    expose:
      - "5173"
    # The Cloudflare Tunnel runs on the host and reaches the origin over loopback only.
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 2m

networks:
  app:
    driver: bridge
    ipam:
      config:
        # A fixed subnet so the API can name the hops it trusts in TRUSTED_PROXIES:
        # the tunnel connector and this proxy are the only peers it sees.
        - subnet: 172.31.0.0/24

volumes:
  appdata:
