# Rakazo on Cloudflare + managed Postgres.
#
# The single-VM shape in docker-compose.prod.yml runs Postgres and Caddy on the host.
# This variant drops both: the database is a managed Postgres service reached over TLS, and
# the public entry point is a Cloudflare Tunnel, so the host opens no inbound ports.
#
# The `web` service keeps the SPA fallback and the /novnc screen proxy. The SPA itself is
# served from the edge by the Cloudflare Worker (apps/web-edge), which proxies the API
# surface back through this stack, so `web` is the tunnel origin rather than the public
# face of the app.
#
#   docker compose --env-file .env -f infra/compose/docker-compose.managed.yml up -d
#
# Secrets come from the environment file, never from this file. The migration URL is only
# present for the API's migration step and is dropped before the server starts.

name: rakazo-managed

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

# What the api and worker both read. Only the keys they use, so a process never sees a
# secret it does not need.
